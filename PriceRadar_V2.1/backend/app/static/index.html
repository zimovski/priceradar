<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>PriceRadar</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#102033;background:#f2f5f9;--ink:#102033;--muted:#66758a;--line:#dfe6ee;--navy:#07111f;--blue:#2563eb;--green:#087a55;--amber:#a15c00;--card:#fff;--shadow:0 12px 34px #0f203312}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef3f8,#f7f9fc 380px,#f2f5f9);min-height:100vh}button,input,a{font:inherit}.shell{max-width:1180px;margin:auto;padding:0 22px 56px}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{display:flex;align-items:center;gap:11px;cursor:pointer}.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900}.logo-name{font-weight:900;font-size:23px;letter-spacing:-.7px}.actions{display:flex;align-items:center;gap:9px}.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700;background:#eaf0f8;color:#42526a}.chip.ok{background:#e8f7f1;color:#087a55}.chip.warn{background:#fff2df;color:#8e5500}.dot{width:7px;height:7px;border-radius:99px;background:currentColor}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--navy);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border:1px solid #cfd8e4}.btn.ghost{background:transparent;color:#40516a}.btn.sm{padding:8px 11px;border-radius:9px;font-size:13px}.btn:disabled{opacity:.55;cursor:wait;transform:none}.hero{background:radial-gradient(circle at 88% 20%,#2563eb2b,transparent 34%),linear-gradient(135deg,#07111f,#132a48);border-radius:26px;color:#fff;padding:34px;box-shadow:0 22px 45px #07111f29}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:850;color:#9bbcff}.hero h1{font-size:35px;letter-spacing:-1.2px;margin:8px 0 7px;line-height:1.1}.hero p{margin:0;color:#c8d4e4;max-width:720px}.searchbar{display:flex;gap:9px;margin-top:24px;background:#fff;border-radius:16px;padding:7px;box-shadow:0 13px 28px #0003}.searchbar input{flex:1;border:0;outline:0;padding:11px 13px;font-size:16px;min-width:0;color:#142235}.searchbar .btn{background:#2563eb;padding-left:24px;padding-right:24px}.hero-meta{margin-top:12px;font-size:12px;color:#9fb0c5;display:flex;gap:16px;flex-wrap:wrap}.section{margin-top:26px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:12px}.title{font-weight:900;font-size:21px;letter-spacing:-.45px}.sub{font-size:13px;color:var(--muted);margin-top:3px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.product-card{padding:16px;cursor:pointer;transition:.17s}.product-card:hover{transform:translateY(-2px);box-shadow:0 16px 38px #0f20331a}.pc-top{display:flex;gap:13px}.pc-img{width:68px;height:68px;border-radius:13px;border:1px solid #e8edf3;object-fit:contain;background:#fff}.pc-name{font-weight:850;line-height:1.28}.muted{color:var(--muted)}.tiny{font-size:12px}.pc-price{font-size:24px;font-weight:950;letter-spacing:-.6px;margin-top:14px}.pc-row{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:12px;color:var(--muted)}.deal{font-weight:800}.excellent,.gooddeal{color:#087a55}.normal{color:#6b7280}.high{color:#a15c00}.empty,.loading{padding:38px 20px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}.spinner{display:inline-block;width:17px;height:17px;border:2px solid #dce3ec;border-top-color:#3b69c9;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}.results{display:grid;gap:10px}.result{display:grid;grid-template-columns:82px 1fr auto;gap:15px;padding:14px;align-items:center}.r-img{width:76px;height:76px;object-fit:contain;border-radius:12px;border:1px solid #e7ecf2}.r-name{font-weight:850}.r-price{font-size:22px;font-weight:950;margin-top:6px}.old{text-decoration:line-through;font-size:12px;color:#9aa6b6;margin-left:6px}.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.pill{font-size:11px;padding:4px 7px;border-radius:999px;background:#edf2f7;color:#56657a;font-weight:750}.pill.free{background:#e8f7f1;color:#087a55}.r-actions{display:flex;gap:8px;flex-direction:column;min-width:132px}.notice{border-radius:14px;padding:13px 15px;font-size:13px;background:#fff1f0;color:#9b2921;border:1px solid #f5d0cc}.backline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.product-hero{padding:20px;display:flex;align-items:center;justify-content:space-between;gap:18px}.product-info{display:flex;align-items:center;gap:16px}.detail-img{width:100px;height:100px;border:1px solid #e7ecf2;border-radius:16px;object-fit:contain}.detail-name{font-size:25px;font-weight:950;letter-spacing:-.7px}.detail-actions{text-align:right}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric{padding:16px}.metric small{display:block;color:var(--muted)}.metric strong{display:block;margin-top:5px;font-size:22px}.metric .tiny{margin-top:4px;color:#8794a6;font-size:11px}.deal-card{display:grid;grid-template-columns:160px 1fr;gap:18px;padding:19px;align-items:center}.scorebox{background:#f5f8fb;border-radius:15px;padding:18px;text-align:center}.score{font-size:37px;font-weight:950}.deal-title{font-size:19px;font-weight:900}.deal-text{font-size:13px;color:var(--muted);margin-top:5px}.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.offer{padding:16px}.offer-price{font-size:23px;font-weight:950;margin:4px 0}.offer-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}.chart-card{padding:18px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.range{border:1px solid #d7dfe8;background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer;font-size:12px;font-weight:750}.range.active{background:#102033;color:#fff;border-color:#102033}.chart{height:320px}.chart svg{width:100%;height:100%}.axis{fill:#8794a6;font-size:11px}.gridline{stroke:#e9eef4}.line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.point{stroke:#fff;stroke-width:1.5}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--muted)}.legend i{width:9px;height:9px;border-radius:99px;display:inline-block;margin-right:5px}.table-card{overflow:hidden}.table-scroll{overflow:auto;max-height:430px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid #edf1f5;font-size:12px}th{position:sticky;top:0;background:#f8fafc;color:#65758a}.kind{font-size:10px;border-radius:999px;padding:3px 6px;background:#eef2f7}.kind.external{background:#fff0d9;color:#8d5a09}.integration{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 16px}.integration-left{display:flex;align-items:center;gap:10px}.ml-logo{width:34px;height:34px;border-radius:10px;background:#ffe600;display:grid;place-items:center;font-weight:950;color:#2d3277}.toast{position:fixed;right:20px;bottom:20px;max-width:360px;padding:13px 15px;border-radius:12px;background:#07111f;color:#fff;box-shadow:0 15px 40px #0004;z-index:50;display:none}.toast.show{display:block}.toast.error{background:#8f211a}.hidden{display:none!important}
@media(max-width:920px){.grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(3,1fr)}.offers{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.shell{padding:0 13px 40px}.topbar{height:66px}.desktop{display:none}.hero{padding:22px 17px;border-radius:20px}.hero h1{font-size:27px}.searchbar{flex-direction:column}.searchbar .btn{width:100%}.grid,.offers{grid-template-columns:1fr}.result{grid-template-columns:64px 1fr}.r-img{width:60px;height:60px}.r-actions{grid-column:1/-1;flex-direction:row}.r-actions .btn{flex:1}.product-hero{align-items:flex-start;flex-direction:column}.product-info{align-items:flex-start}.detail-img{width:78px;height:78px}.detail-name{font-size:21px}.detail-actions{text-align:left}.metrics{grid-template-columns:repeat(2,1fr)}.deal-card{grid-template-columns:1fr}.scorebox{text-align:left}.chart{height:270px}.section-head,.integration{align-items:flex-start;flex-direction:column}.integration .btn{width:100%}}
</style></head><body><div class="shell">
<header class="topbar"><div class="logo" onclick="dashboard()"><div class="logo-mark">PR</div><div class="logo-name">PriceRadar</div></div><div class="actions"><span id="status" class="chip warn desktop"><span class="dot"></span>carregando</span><button class="btn secondary sm" onclick="dashboard()">Meus produtos</button></div></header>
<section class="hero"><div class="eyebrow">Comparador e histórico</div><h1>Pesquise. Compare. Compre na hora certa.</h1><p>Encontre produtos por texto, acompanhe o menor preço e construa um histórico próprio ao longo do tempo.</p><form id="form" class="searchbar"><input id="q" minlength="2" autocomplete="off" placeholder="Ex.: PlayStation 5 Slim Digital, RTX 5070, iPhone..."><button id="searchBtn" class="btn primary">Buscar preços</button></form><div class="hero-meta"><span>✓ preços reais</span><span>✓ histórico persistente</span><span>✓ preparado para novas lojas</span><span>V2.4</span></div></section>
<section id="searchArea" class="section hidden"><div class="section-head"><div><div class="title">Resultados</div><div id="searchSub" class="sub"></div></div><button class="btn ghost sm" onclick="document.querySelector('#searchArea').classList.add('hidden')">Fechar</button></div><div id="results" class="results"></div></section>
<main id="main"></main><section id="integration" class="section"></section></div><div id="toast" class="toast"></div>
<script>
const S={id:null,days:90};const brl=v=>v==null?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const pct=v=>v==null?'—':`${v>0?'+':''}${Number(v).toFixed(1)}%`;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const dt=v=>v?new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';function ago(v){if(!v)return'Nunca';const s=Math.max(0,(Date.now()-new Date(v))/1000);if(s<60)return'agora';if(s<3600)return`há ${Math.floor(s/60)} min`;if(s<86400)return`há ${Math.floor(s/3600)} h`;return`há ${Math.floor(s/86400)} d`}async function api(u,o){const r=await fetch(u,o);let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.detail||d?.message||`Erro ${r.status}`);return d}function toast(m,e=false){const x=document.querySelector('#toast');x.textContent=m;x.className=`toast show${e?' error':''}`;clearTimeout(toast.t);toast.t=setTimeout(()=>x.className='toast',3500)}function dc(l=''){l=l.toLowerCase();return l.includes('excelente')?'excellent':l.includes('bom')?'gooddeal':l.includes('alto')?'high':'normal'}
async function system(){try{const s=await api('/api/v2/system'),x=document.querySelector('#status');x.className=`chip ${s.mercadolivre_connected?'ok':'warn'} desktop`;x.innerHTML=`<span class="dot"></span>${s.mercadolivre_connected?'Mercado Livre conectado':'Mercado Livre desconectado'}`;document.querySelector('#integration').innerHTML=`<div class="section-head"><div><div class="title">Integrações</div><div class="sub">Fontes que alimentam a busca e o histórico.</div></div></div><div class="card integration"><div class="integration-left"><div class="ml-logo">ML</div><div><b>Mercado Livre</b> <span class="chip ${s.mercadolivre_connected?'ok':'warn'}"><span class="dot"></span>${s.mercadolivre_connected?'conectado':'desconectado'}</span><div class="sub">Catálogo, ofertas e preços atuais.</div></div></div><a class="btn ${s.mercadolivre_connected?'secondary':'primary'} sm" href="/mercadolivre/connect">${s.mercadolivre_connected?'Reconectar':'Conectar'}</a></div>`}catch{}}
async function dashboard(){S.id=null;document.querySelector('#searchArea').classList.add('hidden');const m=document.querySelector('#main');m.innerHTML=`<section class="section"><div class="card loading"><span class="spinner"></span>Carregando seus produtos...</div></section>`;try{const d=await api('/api/v2/dashboard');m.innerHTML=`<section class="section"><div class="section-head"><div><div class="title">Meus produtos</div><div class="sub">${d.count} ${d.count===1?'produto acompanhado':'produtos acompanhados'}</div></div></div>${d.products.length?`<div class="grid">${d.products.map(card).join('')}</div>`:`<div class="card empty"><b>Seu radar está vazio</b>Pesquise um produto acima e clique em Acompanhar.</div>`}</section>`}catch(e){m.innerHTML=`<section class="section"><div class="notice">${esc(e.message)}</div></section>`}}function card(p){return`<article class="card product-card" onclick="openProduct(${p.id})"><div class="pc-top">${p.image_url?`<img class="pc-img" src="${esc(p.image_url)}">`:`<div class="pc-img"></div>`}<div><div class="pc-name">${esc(p.name)}</div><div class="muted tiny">${esc([p.brand,p.model].filter(Boolean).join(' • ')||p.best_retailer||'Produto acompanhado')}</div></div></div><div class="pc-price">${brl(p.current_min)}</div><div class="pc-row"><span>mínimo ${brl(p.historical_min)}</span><span class="deal ${dc(p.deal_label)}">${esc(p.deal_label)}</span></div><div class="pc-row"><span>${p.observations} registros</span><span>${ago(p.last_observation)}</span></div></article>`}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();const q=document.querySelector('#q').value.trim();if(q.length>=2)search(q)};async function search(q){const a=document.querySelector('#searchArea'),r=document.querySelector('#results'),b=document.querySelector('#searchBtn');a.classList.remove('hidden');document.querySelector('#searchSub').textContent=`Buscando “${q}”`;r.innerHTML=`<div class="card loading"><span class="spinner"></span>Consultando catálogo e ofertas...</div>`;b.disabled=true;try{const d=await api(`/api/search?q=${encodeURIComponent(q)}&limit=10`);document.querySelector('#searchSub').textContent=`${d.results.length} resultados encontrados`;r.innerHTML=d.results.length?d.results.map(result).join(''):`<div class="card empty"><b>Nenhum produto encontrado</b>Tente marca + modelo ou termos mais específicos.</div>`}catch(e){r.innerHTML=`<div class="notice">${esc(e.message)}</div>`}finally{b.disabled=false;a.scrollIntoView({behavior:'smooth'})}}function result(x){return`<article class="card result">${x.image_url?`<img class="r-img" src="${esc(x.image_url)}">`:`<div class="r-img"></div>`}<div><div class="r-name">${esc(x.name)}</div><div class="muted tiny">${esc([x.brand,x.model,x.seller_name].filter(Boolean).join(' • ')||'Produto de catálogo')}</div><div class="r-price">${brl(x.price)}${x.original_price&&x.original_price>x.price?`<span class="old">${brl(x.original_price)}</span>`:''}</div><div class="pills"><span class="pill">${esc(x.source_name)}</span>${x.shipping_free?'<span class="pill free">frete grátis</span>':''}${x.tracked?'<span class="pill free">acompanhado</span>':''}</div></div><div class="r-actions">${x.local_product_id?`<button class="btn primary sm" onclick="openProduct(${x.local_product_id})">Abrir histórico</button>`:x.source==='mercadolivre'?`<button class="btn primary sm" onclick="track('${esc(x.external_product_id)}',this)">Acompanhar</button>`:''}${x.url?`<a class="btn secondary sm" href="${esc(x.url)}" target="_blank" rel="noopener">Ver oferta</a>`:''}</div></article>`}async function track(id,b){b.disabled=true;b.textContent='Adicionando...';try{const p=await api('/api/search/track-external',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider_slug:'mercadolivre',external_product_id:id})});toast('Produto adicionado ao radar.');openProduct(p.id)}catch(e){toast(e.message,true);b.disabled=false;b.textContent='Acompanhar'}}
async function openProduct(id){S.id=id;document.querySelector('#searchArea').classList.add('hidden');const m=document.querySelector('#main');m.innerHTML=`<section class="section"><div class="card loading"><span class="spinner"></span>Montando histórico...</div></section>`;window.scrollTo({top:0,behavior:'smooth'});try{const [p,i,o,d,h]=await Promise.all([api(`/api/products/${id}`),api(`/api/v2/products/${id}/insights`),api(`/api/products/${id}/latest`),api(`/api/v2/products/${id}/daily?days=${S.days}`),api(`/api/products/${id}/history?days=${S.days}`)]);renderProduct(p,i,o,d,h)}catch(e){m.innerHTML=`<section class="section"><div class="notice">${esc(e.message)}</div></section>`}}function renderProduct(p,i,o,d,h){document.querySelector('#main').innerHTML=`<div class="backline"><button class="btn ghost sm" onclick="dashboard()">← Meus produtos</button><span class="chip">${i.days_observed} dias de histórico</span></div><section class="section card product-hero"><div class="product-info">${p.image_url?`<img class="detail-img" src="${esc(p.image_url)}">`:`<div class="detail-img"></div>`}<div><div class="detail-name">${esc(p.name)}</div><div class="muted tiny">${esc([p.brand,p.model].filter(Boolean).join(' • ')||'Produto acompanhado')}</div></div></div><div class="detail-actions"><button id="refresh" class="btn primary sm" onclick="refresh(this)">↻ Atualizar preço</button><div id="refreshMsg" class="muted tiny" style="margin-top:7px">Última observação ${ago(i.last_observation)}</div></div></section><section class="section"><div class="metrics"><div class="card metric"><small>Menor atual</small><strong>${brl(i.current_min)}</strong><div class="tiny">melhor oferta recente</div></div><div class="card metric"><small>Menor histórico</small><strong>${brl(i.historical_min)}</strong><div class="tiny">desde o início</div></div><div class="card metric"><small>Média 90 dias</small><strong>${brl(i.average_90)}</strong><div class="tiny">mínimos diários</div></div><div class="card metric"><small>Maior histórico</small><strong>${brl(i.historical_max)}</strong><div class="tiny">maior registro</div></div><div class="card metric"><small>Registros</small><strong>${i.observations}</strong><div class="tiny">${i.retailers} lojas</div></div></div></section><section class="section card deal-card"><div class="scorebox"><div class="score ${dc(i.deal_label)}">${i.deal_score??'—'}${i.deal_score!=null?'<small>/100</small>':''}</div><div class="deal ${dc(i.deal_label)}">${esc(i.deal_label)}</div></div><div><div class="deal-title">Momento de compra</div><div class="deal-text">${esc(i.deal_explanation)}</div><div class="facts">${i.vs_average_90_pct!=null?`<span class="chip">vs média 90d: ${pct(i.vs_average_90_pct)}</span>`:''}${i.above_historical_min_pct!=null?`<span class="chip">vs mínimo: ${pct(i.above_historical_min_pct)}</span>`:''}${i.change_from_previous_pct!=null?`<span class="chip">última mudança: ${pct(i.change_from_previous_pct)}</span>`:''}</div></div></section><section class="section"><div class="section-head"><div><div class="title">Ofertas atuais</div><div class="sub">Última oferta observada por loja.</div></div></div>${o.length?`<div class="offers">${o.map(offer).join('')}</div>`:`<div class="card empty"><b>Sem oferta atual</b>Faça uma nova atualização.</div>`}</section><section class="section"><div class="section-head"><div><div class="title">Histórico de preços</div><div class="sub">Mínimo diário por plataforma.</div></div></div><div class="card chart-card"><div class="toolbar">${[[7,'7d'],[30,'30d'],[90,'3m'],[180,'6m'],[365,'1a'],[730,'2a']].map(x=>`<button class="range ${S.days===x[0]?'active':''}" onclick="range(${x[0]})">${x[1]}</button>`).join('')}</div><div class="chart">${chart(d)}</div><div id="legend" class="legend"></div></div></section><section class="section"><div class="section-head"><div><div class="title">Registros recentes</div><div class="sub">Observações usadas nos cálculos.</div></div><span class="chip">${h.length} no período</span></div><div class="card table-card"><div class="table-scroll">${table(h)}</div></div></section>`;legend(d)}function offer(x){return`<div class="card offer"><div class="muted tiny"><b>${esc(x.retailer)}</b></div><div class="offer-price">${brl(x.pix_price||x.price)}</div><div class="muted tiny">${esc(x.seller_name||'Oferta do marketplace')}</div><div class="offer-bottom"><span class="muted tiny">${ago(x.captured_at)}</span>${x.url?`<a class="btn secondary sm" href="${esc(x.url)}" target="_blank" rel="noopener">Abrir oferta</a>`:''}</div></div>`}async function refresh(b){b.disabled=true;try{const r=await api(`/api/products/${S.id}/refresh`,{method:'POST'});toast(r.observations?'Novo registro salvo.':'Preço conferido; sem duplicar registro recente.');openProduct(S.id)}catch(e){toast(e.message,true)}finally{b.disabled=false}}async function range(d){S.days=d;openProduct(S.id)}
const colors=['#2563eb','#0f8a63','#c46b07','#7c4dd6','#d04444'];function chart(rows){if(!rows.length)return`<div class="empty" style="padding-top:90px"><b>Histórico começando agora</b>As próximas coletas formarão a linha de preço.</div>`;const W=1040,H=300,L=65,R=20,T=18,B=42,vals=rows.map(x=>+x.min);let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo*=.97;hi*=1.03}const times=rows.map(x=>new Date(x.date+'T12:00:00').getTime());let a=Math.min(...times),z=Math.max(...times);if(a===z){a-=432e5;z+=432e5}const X=t=>L+(t-a)/(z-a)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);let out='';for(let j=0;j<5;j++){const v=hi-(hi-lo)*j/4,y=Y(v);out+=`<line class="gridline" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text class="axis" x="${L-8}" y="${y+4}" text-anchor="end">${Math.round(v).toLocaleString('pt-BR')}</text>`}const stores=[...new Set(rows.map(x=>x.retailer_slug))];stores.forEach((s,k)=>{const x=rows.filter(r=>r.retailer_slug===s).sort((a,b)=>a.date.localeCompare(b.date));out+=`<polyline class="line" stroke="${colors[k%colors.length]}" points="${x.map(v=>`${X(new Date(v.date+'T12:00:00').getTime())},${Y(+v.min)}`).join(' ')}"/>`;x.forEach(v=>out+=`<circle class="point" fill="${colors[k%colors.length]}" cx="${X(new Date(v.date+'T12:00:00').getTime())}" cy="${Y(+v.min)}" r="4"><title>${v.date} • ${brl(v.min)}</title></circle>`) });return`<svg viewBox="0 0 ${W} ${H}">${out}</svg>`}function legend(r){const e=document.querySelector('#legend'),a=[];r.forEach(x=>{if(!a.some(y=>y.s===x.retailer_slug))a.push({s:x.retailer_slug,n:x.retailer})});e.innerHTML=a.map((x,i)=>`<span><i style="background:${colors[i%colors.length]}"></i>${esc(x.n)}</span>`).join('')}function table(h){if(!h.length)return`<div class="empty"><b>Nenhum registro neste período</b></div>`;return`<table><thead><tr><th>Data</th><th>Loja</th><th>Preço</th><th>PIX</th><th>Fonte</th></tr></thead><tbody>${[...h].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,150).map(x=>`<tr><td>${dt(x.date)}</td><td>${esc(x.retailer)}</td><td><b>${brl(x.price)}</b></td><td>${brl(x.pix_price)}</td><td><span class="kind ${x.source_kind==='external'?'external':''}">${x.source_kind==='external'?'histórico externo':'observado'}</span></td></tr>`).join('')}</tbody></table>`}
