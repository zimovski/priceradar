name: PriceRadar price collection

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

env:
  COLLECTOR_SECRET: ${{ secrets.PRICERADAR_COLLECTOR_SECRET }}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh tracked products
        if: ${{ env.COLLECTOR_SECRET != '' }}
        run: |
          curl --fail --show-error --silent \
            --retry 2 --retry-delay 20 \
            -X POST \
            -H "X-Collector-Secret: ${COLLECTOR_SECRET}" \
            https://priceradar-luwn.onrender.com/api/collect/refresh-all
